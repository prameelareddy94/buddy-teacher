<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1b4d">
<title>Buddy Teacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/kid.css">
</head><body>
<form class="center" method="post" action="/login">
  <div class="owl" style="font-size:72px">🦉</div>
  <h1>Buddy Teacher</h1>
  <input type="password" name="password" placeholder="Password" autofocus required>
  <button type="submit" style="width:100%">Let's study!</button>
  <p class="err" id="err" hidden>That password didn't work. Try again!</p>
</form>
<script>if (location.search.includes("bad")) document.getElementById("err").hidden = false;</script>
</body></html>
